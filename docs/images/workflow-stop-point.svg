<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick workflow stop behavior</title><desc id="desc">Declining a checkpoint stops subsequent steps but cannot undo actions already completed.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="29" font-weight="700">What happens when you decline a checkpoint?</text>
<rect x="70" y="155" width="240" height="105" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="190" y="195" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Shortcut runs</text><text x="190" y="228" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">completed</text>
<rect x="360" y="155" width="250" height="105" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="485" y="195" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="21" font-weight="700">Checkpoint</text><text x="485" y="228" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">choose Yes / No</text>
<rect x="665" y="155" width="190" height="105" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="760" y="195" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Wi-Fi</text><text x="760" y="228" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">not run</text>
<rect x="900" y="155" width="160" height="105" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="980" y="195" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="18" font-weight="700">Shutdown</text><text x="980" y="228" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="16" font-weight="500">not run</text>
<path d="M310 205L353 205" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M610 205L658 205" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M855 205L893 205" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="225" y="350" width="650" height="120" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="550" y="395" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Choose No → the remaining sequence stops</text><text x="550" y="432" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">The earlier Shortcut already ran and cannot be undone.</text>
<text x="550" y="555" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="18" font-weight="500">A failure in any action also stops later actions.</text></g></svg>