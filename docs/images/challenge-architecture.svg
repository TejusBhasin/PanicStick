<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">PanicStick system architecture</title><desc id="desc">Labeled two-dimensional diagram showing a Pico 2 button, USB serial JSON messages, the Mac companion, and user-selected response actions.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="620" rx="30" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="550" y="70" text-anchor="middle" fill="#17243a" font-size="32" font-weight="700">PanicStick • system architecture</text><rect x="55" y="180" width="245" height="180" rx="20" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="177" y="225" text-anchor="middle" fill="#1b473d" font-size="22" font-weight="700">Physical device</text><text x="177" y="270" text-anchor="middle" fill="#42685f" font-size="18">Pico 2 (non-W)</text><text x="177" y="305" text-anchor="middle" fill="#42685f" font-size="17">GP14 button hold</text><text x="177" y="335" text-anchor="middle" fill="#42685f" font-size="15">button is deliberate input</text><path d="M300 270h70" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="380" y="180" width="245" height="180" rx="20" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="502" y="225" text-anchor="middle" fill="#17243a" font-size="22" font-weight="700">USB serial link</text><text x="502" y="270" text-anchor="middle" fill="#53677f" font-size="17">bounded JSON event</text><text x="502" y="305" text-anchor="middle" fill="#53677f" font-size="17">event ID + hold time</text><text x="502" y="335" text-anchor="middle" fill="#53677f" font-size="15">no action is run on data alone</text><path d="M625 270h70" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="705" y="180" width="170" height="180" rx="20" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="790" y="225" text-anchor="middle" fill="#1d4b72" font-size="21" font-weight="700">Mac helper</text><text x="790" y="270" text-anchor="middle" fill="#53677f" font-size="16">validate</text><text x="790" y="305" text-anchor="middle" fill="#53677f" font-size="16">confirm or preview</text><text x="790" y="335" text-anchor="middle" fill="#53677f" font-size="15">execute selected steps</text><path d="M875 270h55" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="940" y="180" width="135" height="180" rx="20" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="1007" y="225" text-anchor="middle" fill="#63410f" font-size="18" font-weight="700">Mac actions</text><text x="1007" y="270" text-anchor="middle" fill="#806238" font-size="15">Shortcut</text><text x="1007" y="300" text-anchor="middle" fill="#806238" font-size="15">network</text><text x="1007" y="330" text-anchor="middle" fill="#806238" font-size="15">apps / power</text><rect x="155" y="440" width="790" height="88" rx="18" fill="#ffe7e8" stroke="#db7e85" stroke-width="2"/><text x="550" y="478" text-anchor="middle" fill="#762a32" font-size="20" font-weight="700">USB arrival triggers actions only when enabled in setup.</text><text x="550" y="508" text-anchor="middle" fill="#762a32" font-size="16">Review mode asks first; unattended mode can run immediately.</text></g></svg>