<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">PanicStick beginner setup flow</title><desc id="desc">Four steps for beginner setup: flash Pico firmware, wire the button, install Mac helper, and test with notification-only and Cancel first.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7890ac"/></marker></defs>
<rect width="1100" height="620" rx="30" fill="url(#bg)"/>
<text x="56" y="75" fill="#17243a" font-family="Arial,sans-serif" font-size="32" font-weight="700">A calm first setup</text><text x="56" y="110" fill="#53677f" font-family="Arial,sans-serif" font-size="18">Start with the harmless test. Add other actions only when you are ready.</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="190" width="225" height="250" rx="22" fill="#fff" stroke="#c8d7e8" stroke-width="3"/>
<circle cx="96" cy="228" r="22" fill="#2c8068"/><text x="96" y="236" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">1</text><text x="96" y="291" fill="#17243a" font-size="21" font-weight="700">Flash Pico</text><text x="96" y="328" fill="#53677f" font-size="16">Install MicroPython</text><text x="96" y="353" fill="#53677f" font-size="16">and copy the two</text><text x="96" y="378" fill="#53677f" font-size="16">firmware files.</text><rect x="96" y="400" width="150" height="12" rx="6" fill="#e6edf6"/>
<rect x="330" y="190" width="225" height="250" rx="22" fill="#fff" stroke="#c8d7e8" stroke-width="3"/>
<circle cx="366" cy="228" r="22" fill="#2c8068"/><text x="366" y="236" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">2</text><text x="366" y="291" fill="#17243a" font-size="21" font-weight="700">Wire one button</text><text x="366" y="328" fill="#53677f" font-size="16">Connect GP14 to</text><text x="366" y="353" fill="#53677f" font-size="16">one leg and GND</text><text x="366" y="378" fill="#53677f" font-size="16">to the other.</text><rect x="366" y="400" width="150" height="12" rx="6" fill="#e6edf6"/>
<rect x="600" y="190" width="225" height="250" rx="22" fill="#fff" stroke="#c8d7e8" stroke-width="3"/>
<circle cx="636" cy="228" r="22" fill="#2c8068"/><text x="636" y="236" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">3</text><text x="636" y="291" fill="#17243a" font-size="21" font-weight="700">Install on Mac</text><text x="636" y="328" fill="#53677f" font-size="16">Run install.command</text><text x="636" y="353" fill="#53677f" font-size="16">and choose actions</text><text x="636" y="378" fill="#53677f" font-size="16">in the setup screen.</text><rect x="636" y="400" width="150" height="12" rx="6" fill="#e6edf6"/>
<rect x="870" y="190" width="170" height="250" rx="22" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/>
<circle cx="906" cy="228" r="22" fill="#3378aa"/><text x="906" y="236" fill="#fff" text-anchor="middle" font-size="21" font-weight="700">4</text><text x="906" y="291" fill="#17243a" font-size="21" font-weight="700">Test safely</text><text x="906" y="328" fill="#53677f" font-size="16">Pick notification</text><text x="906" y="353" fill="#53677f" font-size="16">only. Plug in, then</text><text x="906" y="378" fill="#53677f" font-size="16">try Cancel first.</text>
</g>
<path d="M286 313h35M556 313h35M826 313h35" stroke="#7890ac" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="483" width="980" height="76" rx="18" fill="#fff2df" stroke="#e1ad62" stroke-width="2"/><text x="86" y="516" fill="#63410f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Before testing app closing or connectivity changes:</text><text x="86" y="542" fill="#806238" font-family="Arial,sans-serif" font-size="17">Save your work. Cancel always runs nothing. Power off asks twice and is the final step.</text>
</svg>