<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick setup with unattended mode</title><desc id="desc">Setup lets a user choose review every time or unattended mode and insert per-action confirmation checkpoints.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="31" font-weight="700">Choose how triggers should run</text>
<rect x="65" y="125" width="450" height="150" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="290" y="170" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Ask before each run</text><text x="290" y="207" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Recommended default</text><text x="290" y="238" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">Review list • Cancel runs nothing</text>
<rect x="585" y="125" width="450" height="150" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="810" y="170" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="23" font-weight="700">Unattended</text><text x="810" y="207" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="17" font-weight="500">Skip the opening prompt</text><text x="810" y="238" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">Selected checkpoints still pause</text>
<text x="550" y="330" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Select any action to add a checkpoint immediately before it</text>
<rect x="115" y="365" width="870" height="90" rx="16" fill="#fff" stroke="#c8d7e8" stroke-width="3"/><text x="550" y="402" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="19" font-weight="700">☐ Shortcut      ☑ Wi-Fi      ☐ Quit apps      ☑ Power off</text><text x="550" y="433" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="15" font-weight="500">Power-off checkpoint starts selected when shutdown is enabled.</text>
<rect x="115" y="500" width="870" height="92" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="550" y="537" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="19" font-weight="700">A takeover may block or manipulate the prompt.</text><text x="550" y="568" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="16" font-weight="500">You may be unable to select Confirm.</text></g></svg>