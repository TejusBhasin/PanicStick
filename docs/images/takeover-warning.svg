<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick confirmation takeover limitation</title><desc id="desc">On a compromised Mac, a prompt can be blocked or manipulated; users may not be able to select confirm.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="78" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="31" font-weight="700">Confirmation has a real limitation</text>
<rect x="70" y="150" width="430" height="210" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="285" y="195" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Normal use</text><rect x="145" y="230" width="280" height="68" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="285" y="273" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Review • Run / Cancel</text><text x="285" y="326" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">User can inspect the selected steps.</text>
<rect x="600" y="150" width="430" height="210" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="815" y="195" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="24" font-weight="700">Mac taken over</text><rect x="675" y="230" width="280" height="68" rx="16" fill="#fff" stroke="#db7e85" stroke-width="3"/><text x="815" y="273" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="18" font-weight="700">Prompt blocked / changed</text><text x="815" y="326" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="17" font-weight="500">You may be unable to confirm.</text>
<path d="M500 260L590 260" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="145" y="425" width="810" height="115" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="550" y="470" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Review mode is a useful pause, not protection from malware.</text><text x="550" y="508" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">Unattended mode avoids UI waits but starts immediately at an enabled trigger.</text>
<text x="550" y="600" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Test with notification-only before enabling disruptive actions.</text></g></svg>