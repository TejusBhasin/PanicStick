<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">PanicStick read-only preview</title><desc id="desc">Labeled flow for the --preview command: load settings, display trigger mode and ordered actions, then exit without opening the Pico or running actions.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="620" rx="30" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="550" y="70" text-anchor="middle" fill="#17243a" font-size="32" font-weight="700">Read-only workflow preview</text><rect x="75" y="190" width="235" height="150" rx="20" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="192" y="235" text-anchor="middle" fill="#1d4b72" font-size="22" font-weight="700">Run command</text><text x="192" y="278" text-anchor="middle" fill="#53677f" font-size="20" font-family="monospace">--preview</text><text x="192" y="315" text-anchor="middle" fill="#53677f" font-size="15">does not trigger actions</text><path d="M310 265h65" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="385" y="190" width="270" height="150" rx="20" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="520" y="235" text-anchor="middle" fill="#17243a" font-size="21" font-weight="700">Read saved setup</text><text x="520" y="278" text-anchor="middle" fill="#53677f" font-size="16">triggers + mode</text><text x="520" y="310" text-anchor="middle" fill="#53677f" font-size="16">action order + pauses</text><path d="M655 265h65" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="730" y="190" width="290" height="150" rx="20" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="875" y="235" text-anchor="middle" fill="#1b473d" font-size="21" font-weight="700">Print plan and exit</text><text x="875" y="278" text-anchor="middle" fill="#42685f" font-size="16">no USB connection</text><text x="875" y="310" text-anchor="middle" fill="#42685f" font-size="16">no app / system changes</text><rect x="135" y="420" width="830" height="90" rx="18" fill="#fff2df" stroke="#e1ad62" stroke-width="2"/><text x="550" y="460" text-anchor="middle" fill="#63410f" font-size="20" font-weight="700">Use the preview to catch ordering or checkpoint mistakes before testing.</text><text x="550" y="490" text-anchor="middle" fill="#806238" font-size="16">It displays what is configured; it does not prove hardware behavior.</text></g></svg>