<title id="title">Bare Pico 2 board and PanicStick button</title><desc id="desc">Flat overhead technical illustration of a Raspberry Pi Pico 2 non-W board, Micro-USB connector, GP14 and ground wires, and a separate momentary button. No housing.</desc>
