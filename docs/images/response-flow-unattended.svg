<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick unattended response flow</title><desc id="desc">An enabled USB insertion or button trigger starts the workflow without an opening confirmation; selected checkpoints pause before their actions.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="31" font-weight="700">Unattended response flow</text>
<rect x="65" y="130" width="250" height="95" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="190" y="170" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Enabled trigger</text><text x="190" y="200" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">Insertion or button hold</text>
<path d="M315 178L385 178" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="130" width="305" height="95" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="542" y="170" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="22" font-weight="700">Start prompt skipped</text><text x="542" y="200" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">only in unattended mode</text>
<path d="M695 178L765 178" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="770" y="130" width="265" height="95" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="902" y="170" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Run action order</text><text x="902" y="200" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">Shortcut → settings → apps</text>
<rect x="95" y="300" width="270" height="100" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="230" y="342" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Optional checkpoint</text><text x="230" y="375" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">before any selected action</text>
<rect x="415" y="300" width="270" height="100" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="550" y="342" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="21" font-weight="700">Choose No</text><text x="550" y="375" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">later actions stop</text>
<rect x="735" y="300" width="270" height="100" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="870" y="342" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="21" font-weight="700">Shutdown last</text><text x="870" y="375" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="16" font-weight="500">checkpoint on by default</text>
<path d="M902 225L870 293" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M365 350L407 350" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="160" y="465" width="780" height="115" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="550" y="510" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="22" font-weight="700">Takeover warning</text><text x="550" y="545" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">A compromised Mac may block or manipulate prompts; you may not be able to confirm.</text>
<text x="550" y="625" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Insertion starts actions only when explicitly enabled.</text></g></svg>