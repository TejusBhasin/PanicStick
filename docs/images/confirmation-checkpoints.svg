<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Configurable PanicStick confirmation checkpoints</title><desc id="desc">The user can place prompts immediately before any chosen action; declining stops later steps.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Put a pause before any selected action</text>
<rect x="55" y="150" width="220" height="90" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="165" y="188" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Trigger</text><text x="165" y="215" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">insertion / button</text>
<rect x="325" y="150" width="215" height="90" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="432" y="188" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Shortcut</text><text x="432" y="215" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">optional step</text>
<rect x="590" y="150" width="215" height="90" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="697" y="188" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Wi-Fi</text><text x="697" y="215" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">optional step</text>
<rect x="855" y="150" width="190" height="90" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="950" y="188" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="19" font-weight="700">Power off</text><text x="950" y="215" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="16" font-weight="500">last</text>
<path d="M275 195L318 195" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M540 195L583 195" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M805 195L848 195" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="290" y="300" width="260" height="88" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="420" y="337" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Confirm here?</text><text x="420" y="366" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">before Shortcut</text>
<rect x="575" y="300" width="260" height="88" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="705" y="337" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Confirm here?</text><text x="705" y="366" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">before Wi-Fi</text>
<rect x="280" y="455" width="540" height="95" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="550" y="495" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Select No to stop later actions</text><text x="550" y="525" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">Completed earlier steps cannot be rolled back.</text>
<path d="M430 240L420 293" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M697 240L705 293" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M420 388L500 448" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<text x="550" y="620" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Checkpoint order follows the action sequence; shutdown stays last.</text></g></svg>