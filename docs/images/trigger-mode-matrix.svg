<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick trigger and confirmation mode matrix</title><desc id="desc">USB insertion and physical button triggers are independent of review or unattended confirmation mode.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="29" font-weight="700">Triggers and confirmation are separate choices</text>
<rect x="85" y="145" width="275" height="130" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="222" y="190" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">USB insertion</text><text x="222" y="230" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Optional trigger</text>
<rect x="413" y="145" width="275" height="130" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="550" y="190" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Button hold</text><text x="550" y="230" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">2 seconds • optional</text>
<rect x="740" y="145" width="275" height="130" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="877" y="190" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="22" font-weight="700">Can enable both</text><text x="877" y="230" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="17" font-weight="500">or disable both</text>
<rect x="130" y="350" width="390" height="120" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="325" y="395" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Ask before each run</text><text x="325" y="435" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">Default • cancel starts nothing</text>
<rect x="580" y="350" width="390" height="120" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="775" y="395" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="22" font-weight="700">Unattended</text><text x="775" y="435" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="17" font-weight="500">Runs except at checkpoints</text>
<path d="M550 275L325 342" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M550 275L775 342" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<text x="550" y="555" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="18" font-weight="500">USB insertion only starts actions after you enable it in setup.</text></g></svg>