<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">PanicStick Pico 2 button wiring</title><desc id="desc">Labeled two-dimensional wiring diagram connecting a normally-open momentary button between Pico 2 GP14 and ground, with no connection to 3V3.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient></defs><rect width="1100" height="620" rx="30" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="550" y="70" text-anchor="middle" fill="#17243a" font-size="32" font-weight="700">Button wiring • Pico 2 (non-W)</text><rect x="80" y="150" width="520" height="360" rx="24" fill="#26765f" stroke="#164b43" stroke-width="5"/><text x="340" y="200" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Raspberry Pi Pico 2</text><rect x="130" y="250" width="420" height="66" rx="14" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="165" y="292" fill="#17243a" font-size="20" font-weight="700">GP14</text><rect x="130" y="355" width="420" height="66" rx="14" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="165" y="397" fill="#17243a" font-size="20" font-weight="700">GND</text><rect x="720" y="245" width="245" height="180" rx="22" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><circle cx="842" cy="325" r="45" fill="#344256"/><circle cx="842" cy="325" r="29" fill="#dfe7f0"/><text x="842" y="385" text-anchor="middle" fill="#17243a" font-size="19" font-weight="700">Normally-open button</text><path d="M550 283C650 283 630 305 720 305" fill="none" stroke="#31a5db" stroke-width="8"/><path d="M550 388C650 388 630 345 720 345" fill="none" stroke="#e9aa45" stroke-width="8"/><text x="665" y="270" text-anchor="middle" fill="#1d4b72" font-size="17" font-weight="700">wire 1</text><text x="665" y="410" text-anchor="middle" fill="#806238" font-size="17" font-weight="700">wire 2</text><rect x="635" y="465" width="365" height="70" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="2"/><text x="817" y="495" text-anchor="middle" fill="#762a32" font-size="18" font-weight="700">Do not connect the button to 3V3.</text><text x="817" y="520" text-anchor="middle" fill="#762a32" font-size="15">Disconnect USB power before wiring.</text></g></svg>