<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">PanicStick action flow and checkpoints</title><desc id="desc">Labeled sequence showing Shortcut before connectivity and app actions, optional confirmations before chosen steps, failures stopping later steps, and shutdown last.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="620" rx="30" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="550" y="68" text-anchor="middle" fill="#17243a" font-size="30" font-weight="700">Action order • checkpoints are placed just before a step</text><rect x="55" y="175" width="205" height="100" rx="18" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="157" y="215" text-anchor="middle" fill="#1b473d" font-size="20" font-weight="700">Shortcut</text><text x="157" y="246" text-anchor="middle" fill="#42685f" font-size="15">runs first if selected</text><path d="M260 225h32" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="305" y="175" width="220" height="100" rx="18" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="415" y="215" text-anchor="middle" fill="#1d4b72" font-size="20" font-weight="700">Connectivity</text><text x="415" y="246" text-anchor="middle" fill="#53677f" font-size="15">network / SSH</text><path d="M525 225h32" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="570" y="175" width="210" height="100" rx="18" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="675" y="215" text-anchor="middle" fill="#63410f" font-size="20" font-weight="700">Apps</text><text x="675" y="246" text-anchor="middle" fill="#806238" font-size="15">quit normally</text><path d="M780 225h32" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><rect x="825" y="175" width="220" height="100" rx="18" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="935" y="215" text-anchor="middle" fill="#762a32" font-size="20" font-weight="700">Power off</text><text x="935" y="246" text-anchor="middle" fill="#762a32" font-size="15">always last</text><rect x="60" y="350" width="980" height="105" rx="18" fill="#fff" stroke="#9bb0c8" stroke-width="2"/><text x="550" y="392" text-anchor="middle" fill="#17243a" font-size="20" font-weight="700">Choose any step as a confirmation checkpoint</text><text x="550" y="425" text-anchor="middle" fill="#53677f" font-size="17">Declining a checkpoint or hitting an action error stops every later step.</text><rect x="180" y="500" width="740" height="58" rx="15" fill="#fff2df" stroke="#e1ad62" stroke-width="2"/><text x="550" y="536" text-anchor="middle" fill="#63410f" font-size="17" font-weight="600">Earlier completed actions cannot be rolled back by PanicStick.</text></g></svg>