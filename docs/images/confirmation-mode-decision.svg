<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">PanicStick choosing a confirmation mode</title>
<desc id="desc">Two-dimensional decision illustration comparing review-every-time mode with unattended mode and action-specific checkpoints.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs>
<rect width="1100" height="650" rx="30" fill="url(#bg)"/>
<g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-size="30" font-weight="700">Which confirmation mode fits your setup?</text>
<rect x="360" y="115" width="380" height="100" rx="20" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="550" y="157" text-anchor="middle" fill="#17243a" font-size="22" font-weight="700">Can you interact with the Mac prompt?</text><text x="550" y="189" text-anchor="middle" fill="#53677f" font-size="16">Consider whether someone else controls the computer.</text>
<path d="M450 215C400 265 300 265 275 315" fill="none" stroke="#55708e" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 215C700 265 800 265 825 315" fill="none" stroke="#55708e" stroke-width="4" marker-end="url(#arrow)"/>
<text x="330" y="276" text-anchor="middle" fill="#2c8068" font-size="18" font-weight="700">YES</text><text x="770" y="276" text-anchor="middle" fill="#a56813" font-size="18" font-weight="700">NO / NEED HANDS-FREE</text>
<rect x="70" y="320" width="410" height="165" rx="20" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="275" y="365" text-anchor="middle" fill="#1d4b72" font-size="23" font-weight="700">Ask before each run</text><text x="275" y="405" text-anchor="middle" fill="#53677f" font-size="17">Recommended default</text><text x="275" y="438" text-anchor="middle" fill="#53677f" font-size="17">Review the list • Cancel runs none</text><text x="275" y="466" text-anchor="middle" fill="#53677f" font-size="15">You must be able to respond to the prompt.</text>
<rect x="620" y="320" width="410" height="165" rx="20" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="825" y="365" text-anchor="middle" fill="#63410f" font-size="23" font-weight="700">Unattended mode</text><text x="825" y="405" text-anchor="middle" fill="#806238" font-size="17">No opening prompt</text><text x="825" y="438" text-anchor="middle" fill="#806238" font-size="17">Add a pause before chosen actions</text><text x="825" y="466" text-anchor="middle" fill="#806238" font-size="15">Enabled triggers start actions automatically.</text>
<rect x="140" y="535" width="820" height="70" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="2"/><text x="550" y="566" text-anchor="middle" fill="#762a32" font-size="18" font-weight="700">A fully compromised Mac may block or manipulate confirmation.</text><text x="550" y="590" text-anchor="middle" fill="#762a32" font-size="15">Test with notification-only first; prompts are not a malware defense.</text>
</g></svg>