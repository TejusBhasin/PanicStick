<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Illustrative PanicStick checkpoint picker</title><desc id="desc">Illustration of choosing action-specific confirmations in the setup interface.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="29" font-weight="700">Illustration • checkpoint list in setup</text>
<rect x="220" y="115" width="660" height="440" rx="16" fill="#fff" stroke="#c8d7e8" stroke-width="3"/><text x="550" y="160" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ask before these steps</text>
<rect x="275" y="200" width="550" height="55" rx="16" fill="#f8fbff" stroke="#d0d9e5" stroke-width="3"/><text x="310" y="235" text-anchor="start" fill="#17243a" font-family="Arial,sans-serif" font-size="18" font-weight="500">☐ Run Shortcut</text>
<rect x="275" y="270" width="550" height="55" rx="16" fill="#fff7e9" stroke="#e1ad62" stroke-width="3"/><text x="310" y="305" text-anchor="start" fill="#63410f" font-family="Arial,sans-serif" font-size="18" font-weight="500">☑ Turn Wi-Fi off</text>
<rect x="275" y="340" width="550" height="55" rx="16" fill="#f8fbff" stroke="#d0d9e5" stroke-width="3"/><text x="310" y="375" text-anchor="start" fill="#17243a" font-family="Arial,sans-serif" font-size="18" font-weight="500">☐ Quit selected apps</text>
<rect x="275" y="410" width="550" height="55" rx="16" fill="#fff7e9" stroke="#e1ad62" stroke-width="3"/><text x="310" y="445" text-anchor="start" fill="#63410f" font-family="Arial,sans-serif" font-size="18" font-weight="500">☑ Shut down Mac • default</text>
<text x="550" y="505" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">The prompt appears immediately before that action.</text>
<rect x="350" y="575" width="400" height="50" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="550" y="607" text-anchor="middle" fill="#1d4b72" font-family="Arial,sans-serif" font-size="18" font-weight="700">Save settings</text></g></svg>