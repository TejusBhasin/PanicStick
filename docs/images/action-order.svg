<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">PanicStick action ordering and shutdown</title><desc id="desc">Shortcuts run before network and app changes, while shutdown runs last; checkpoints can be placed before any action.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Action sequence • shutdown stays last</text>
<rect x="60" y="150" width="220" height="105" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="170" y="193" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Shortcut</text><text x="170" y="225" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">first</text>
<rect x="320" y="150" width="220" height="105" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="430" y="193" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Connectivity</text><text x="430" y="225" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="15" font-weight="500">Wi-Fi / Bluetooth</text>
<rect x="580" y="150" width="220" height="105" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="690" y="193" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="22" font-weight="700">Apps</text><text x="690" y="225" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">quit normally</text>
<rect x="840" y="150" width="210" height="105" rx="16" fill="#ffe7e8" stroke="#db7e85" stroke-width="3"/><text x="945" y="193" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="20" font-weight="700">Shutdown</text><text x="945" y="225" text-anchor="middle" fill="#762a32" font-family="Arial,sans-serif" font-size="16" font-weight="500">last step</text>
<path d="M280 200L313 200" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M540 200L573 200" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M800 200L833 200" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="140" y="340" width="820" height="95" rx="16" fill="#fff" stroke="#9bb0c8" stroke-width="3"/><text x="550" y="380" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Add a checkpoint before any action</text><text x="550" y="410" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">Declining stops the rest; finished steps are not undone.</text>
<rect x="220" y="485" width="660" height="95" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="550" y="525" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="20" font-weight="700">Shutdown checkpoint is on by default</text><text x="550" y="555" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">Remove it only if unattended power-off is intended.</text>
<text x="550" y="625" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="17" font-weight="500">No step runs after the system shutdown request.</text></g></svg>