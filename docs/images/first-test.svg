<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Safe first test for PanicStick</title><desc id="desc">Start with notification only, test with confirmation mode, cancel once, then run and check the local log.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#55708e"/></marker></defs><rect width="1100" height="650" rx="30" fill="url(#g)"/><g font-family="Arial,sans-serif">
<text x="550" y="70" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="29" font-weight="700">A safe first test takes four small steps</text>
<rect x="55" y="165" width="220" height="120" rx="16" fill="#fff" stroke="#c8d7e8" stroke-width="3"/><text x="165" y="208" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">1 • Notify only</text><text x="165" y="245" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">no system changes</text>
<rect x="320" y="165" width="220" height="120" rx="16" fill="#e7f3ff" stroke="#78a9d5" stroke-width="3"/><text x="430" y="208" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">2 • Plug in</text><text x="430" y="245" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">review the prompt</text>
<rect x="585" y="165" width="220" height="120" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="695" y="208" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="20" font-weight="700">3 • Choose Cancel</text><text x="695" y="245" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="16" font-weight="500">nothing runs</text>
<rect x="850" y="165" width="200" height="120" rx="16" fill="#e2f2ed" stroke="#6aa68f" stroke-width="3"/><text x="950" y="208" text-anchor="middle" fill="#17243a" font-family="Arial,sans-serif" font-size="21" font-weight="700">4 • Run once</text><text x="950" y="245" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="16" font-weight="500">check local log</text>
<path d="M275 225L313 225" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M540 225L578 225" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/><path d="M805 225L843 225" stroke="#55708e" stroke-width="4" marker-end="url(#a)"/>
<rect x="170" y="380" width="760" height="105" rx="16" fill="#fff2df" stroke="#e1ad62" stroke-width="3"/><text x="550" y="423" text-anchor="middle" fill="#63410f" font-family="Arial,sans-serif" font-size="21" font-weight="700">Only then add one action at a time.</text><text x="550" y="458" text-anchor="middle" fill="#806238" font-family="Arial,sans-serif" font-size="17" font-weight="500">Save work before testing app closing or network changes.</text>
<text x="550" y="570" text-anchor="middle" fill="#53677f" font-family="Arial,sans-serif" font-size="18" font-weight="500">Never use destructive actions as your first test.</text></g></svg>