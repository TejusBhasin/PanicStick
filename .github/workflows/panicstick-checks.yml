name: PanicStick checks

on:
  push:
    paths:
      - "mac/**"
      - "pico/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "docs/**"
      - ".github/workflows/panicstick-checks.yml"
  pull_request:
    paths:
      - "mac/**"
      - "pico/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "docs/**"
      - ".github/workflows/panicstick-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11"]
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Mac companion dependency
        run: python -m pip install -r requirements.txt
      - name: Run automated tests and save output
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee panicstick-tests.log
      - name: Check Python syntax
        run: python -m compileall -q mac pico tests
      - name: Check installer shell syntax
        shell: bash
        run: bash -n mac/install.command mac/uninstall.command
      - name: Add test output to workflow summary
        if: always()
        shell: bash
        run: |
          echo "## PanicStick automated test output" >> "$GITHUB_STEP_SUMMARY"
          if [ -f panicstick-tests.log ]; then
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            cat panicstick-tests.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The test command did not produce a log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panicstick-tests-${{ runner.os }}
          path: panicstick-tests.log
          if-no-files-found: ignore
